name: CI

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Check resolved Ruby dependencies against ruby-advisory-db
        run: bundle exec bundler-audit check --update

  lint:
    runs-on: ubuntu-24.04
    env:
      RUBY_VERSION: ruby-3.3
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.RUBY_VERSION }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.RUBY_VERSION }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4" ]
        rails: [ "8.0", "8.1" ]
    env:
      RAILS_ENV: test
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Prepare the test database
        run: bin/rails db:test:prepare

      - name: Run tests
        run: bin/rails test

      - name: Verify reference host transactions and recovery state
        run: bin/check-reference

      - name: Verify RubyLLM 2.1.1 against deterministic provider SSE
        run: bundle exec ruby -Itest test/compatibility/ruby_llm_smoke.rb

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshots-ruby${{ matrix.ruby }}-rails${{ matrix.rails }}
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  system:
    runs-on: ubuntu-24.04
    env:
      RUBY_VERSION: ruby-3.3
      RAILS_VERSION: "8.1"
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Prepare the test database
        run: bin/rails db:test:prepare

      - name: Run browser (system) tests
        run: bin/check-browser

      - name: Fetch the real checksum-locked runtime
        run: bundle exec rake "app:openui:runtime:fetch[$RUNNER_TEMP/openui-runtime]"

      - name: Verify the real runtime, actions, tools, and keyboard activation
        run: bin/check-browser --runtime "$RUNNER_TEMP/openui-runtime"

      - name: Verify default setup from the built gem in a real browser
        run: |
          bundle exec gem build openui-rails.gemspec --output "$RUNNER_TEMP/openui-rails.gem"
          bundle exec ruby bin/smoke-package "$RUNNER_TEMP/openui-rails.gem" --runtime "$RUNNER_TEMP/openui-runtime"
          bin/check-reference --gem "$RUNNER_TEMP/openui-rails.gem" --runtime "$RUNNER_TEMP/openui-runtime"

      - name: Keep fixture browser screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: system-screenshots
          path: ${{ github.workspace }}/tmp/browser
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-24.04
    env:
      RUBY_VERSION: ruby-3.3
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Check release or candidate metadata
        run: |
          ruby -ryaml -rrbconfig <<'RUBY'
          require_relative "lib/openui/rails/version"
          docs = YAML.load_file("docs/_config.yml")
          arguments = docs["released"] ? [ "v#{OpenUI::Rails::VERSION}" ] : [ "--candidate" ]
          abort "metadata check failed" unless system(RbConfig.ruby, "bin/check-release", *arguments)
          RUBY

      - name: Build the gem
        run: gem build openui-rails.gemspec

      - name: Verify the packaged file list
        run: |
          gem spec openui-rails-*.gem files --yaml > packaged_files.txt
          for expected in \
            lib/openui/rails.rb \
            lib/openui/rails/engine.rb \
            lib/openui/rails/stream/broadcaster.rb \
            lib/openui/rails/runtime_package.rb \
            app/controllers/openui/rails/actions_controller.rb \
            app/javascript/openui/rails/openui_controller.js \
            app/javascript/openui/rails/openui_envelope_controller.js \
            LICENSE README.md CHANGELOG.md THIRD_PARTY_NOTICES.md \
            CONFIGURATION.md UPGRADING.md SECURITY.md; do
            grep -qxF -- "- $expected" packaged_files.txt \
              || { echo "missing from gem: $expected"; exit 1; }
          done

      - name: Install and require the built gem
        run: |
          gem install ./openui-rails-*.gem --no-document
          ruby -e 'require "openui/rails"; puts "openui-rails #{OpenUI::Rails::VERSION}"'

      - name: Generate and boot a fresh Rails host from the built artifact
        run: bundle exec ruby bin/smoke-package openui-rails-*.gem
