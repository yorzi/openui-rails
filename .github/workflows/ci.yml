name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      RUBY_VERSION: ruby-3.3
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.RUBY_VERSION }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.RUBY_VERSION }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4" ]
        rails: [ "8.0", "8.1" ]
    env:
      RAILS_ENV: test
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bin/rails db:test:prepare test

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-ruby${{ matrix.ruby }}-rails${{ matrix.rails }}
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    env:
      RUBY_VERSION: ruby-3.3
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Build the gem
        run: gem build openui-rails.gemspec

      - name: Verify the packaged file list
        run: |
          gem spec openui-rails-*.gem files --yaml > packaged_files.txt
          for expected in \
            lib/openui/rails.rb \
            lib/openui/rails/engine.rb \
            app/controllers/openui/rails/actions_controller.rb \
            app/javascript/openui/rails/openui_controller.js \
            LICENSE README.md CHANGELOG.md THIRD_PARTY_NOTICES.md; do
            grep -qxF -- "- $expected" packaged_files.txt \
              || { echo "missing from gem: $expected"; exit 1; }
          done

      - name: Install and require the built gem
        run: |
          gem install ./openui-rails-*.gem --no-document
          ruby -e 'require "rails"; require "openui/rails"; puts "openui-rails #{OpenUI::Rails::VERSION}"'
