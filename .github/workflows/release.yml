name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must match VERSION and dated release notes)
        required: true
        type: string
      publish:
        description: Publish to RubyGems after all verification succeeds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.revision }}

  package:
    needs: [ resolve, verify ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Check tag and release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: ruby bin/check-release
      - run: gem build openui-rails.gemspec
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gem
          path: openui-rails-*.gem

  publish:
    needs: [ resolve, package ]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    # Configure required reviewers in GitHub and a Trusted Publisher in RubyGems.
    # The environment name alone does not create a required-reviewer rule.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: true
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1
        with:
          ruby-version: "3.3"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-gem
      - name: Refuse a tag moved after verification
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.revision }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$EXPECTED_SHA"
      - name: Remove checkout token before RubyGems publishing
        run: git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Configure short-lived RubyGems credentials with OIDC
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish the verified artifact
        run: gem push openui-rails-*.gem --host https://rubygems.org

  draft_release:
    needs: [ resolve, publish ]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-gem
      - name: Prepare the verified gem checksum and dated release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          sha256sum "openui-rails-${version}.gem" > SHA256SUMS
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text()
          heading = f"## [{version}]"
          start = changelog.index(heading)
          end = changelog.find("\n## [", start + len(heading))
          if end < 0:
              end = changelog.find("\n[Unreleased]:", start)
          notes = changelog[start:end if end >= 0 else None].strip()
          Path("release-notes.md").write_text(notes + "\n")
          PY
      - name: Draft the GitHub release for owner review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG" --draft --title "openui-rails $RELEASE_TAG"
          --notes-file release-notes.md --verify-tag --repo "$GITHUB_REPOSITORY"
          openui-rails-*.gem SHA256SUMS
