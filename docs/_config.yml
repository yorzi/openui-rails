title: "OpenUI Rails"
description: "Render model-generated OpenUI Lang interfaces in Rails while keeping actions, authorization, and persistence on the server."
tagline: "OpenUI Lang in Rails, with server-owned actions."
url: https://openui-rails.wangyaodi.com
baseurl: ""
lang: en-US
repository: yorzi/openui-rails

theme: jekyll-vitepress-theme

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false
permalink: pretty

collections:
  getting_started:
    permalink: "/:name/"
    output: true
  core_features:
    permalink: "/:name/"
    output: true
  advanced:
    permalink: "/:name/"
    output: true
  reference:
    permalink: "/:name/"
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
      jekyll_vitepress:
        auto_title: false

jekyll_vitepress:
  seo:
    page_type: TechArticle
    publisher:
      type: Organization
      name: "OpenUI Rails"
      url: https://openui-rails.wangyaodi.com
      same_as:
        - https://github.com/yorzi/openui-rails
  llms:
    title: OpenUI Rails Documentation
    description: "Render model-generated OpenUI Lang interfaces in Rails while keeping actions, authorization, and persistence on the server."
    full: true
  branding:
    site_title: "OpenUI Rails"
  typography:
    body_font_family: "'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    code_font_family: "'IBM Plex Mono', ui-monospace, monospace"
    google_fonts_url: "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@300;400;500;600;700;900&display=swap"
  syntax:
    light_theme: github
    dark_theme: github.dark
  tokens:
    light:
      "--vp-c-brand-1": "#5654D4"
      "--vp-c-brand-2": "#6E6CDA"
      "--vp-c-brand-3": "#3E3CCE"
      "--vp-c-brand-soft": "rgba(86, 84, 212, 0.14)"
    dark:
      "--vp-c-brand-1": "#8685E0"
      "--vp-c-brand-2": "#6E6CDA"
      "--vp-c-brand-3": "#5654D4"
      "--vp-c-brand-soft": "rgba(134, 133, 224, 0.18)"
  github_star:
    enabled: true
    repository: yorzi/openui-rails
    text: Star
    show_count: true
  footer:
    enabled: true
    show_on_docs: false
    message: "Released under the MIT License."
    copyright: "Copyright © 2026 Andy Wang"
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%-d %b %Y"
  edit_link:
    enabled: true
    pattern: https://github.com/yorzi/openui-rails/edit/main/docs/:path
    text: Edit this page on GitHub

plugins:
  - jekyll-redirect-from
  - jekyll-vitepress-theme

exclude:
  - bin
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md

# The language of code examples; `project-docs` uses it for new pages.
code_language: ruby

# Values that change between releases. Pages read them as {{ site.version }}
# and {{ site.examples.NAME }}, so one edit here updates every page. Set
# `released: true` and the new version in the commit you tag for a release.
released: true
version: "0.9.1"
compatibility:
  browser_runtime: "0.2.1"
  cli: "0.6.0"
  ruby_llm: "2.1.1"
examples: {}
